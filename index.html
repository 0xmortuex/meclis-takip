<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Öğrenci Meclisi Takip</title>
<meta name="theme-color" content="#F5F6F8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style id="css">
@font-face {
  font-family: 'Atkinson Hyperlegible Next';
  font-style: normal;
  font-weight: 400 700;
  font-display: swap;
  src: url(fonts/atkinson-hyperlegible-next-latin-ext.woff2) format('woff2');
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
@font-face {
  font-family: 'Atkinson Hyperlegible Next';
  font-style: normal;
  font-weight: 400 700;
  font-display: swap;
  src: url(fonts/atkinson-hyperlegible-next-latin.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: 'Bricolage Grotesque';
  font-style: normal;
  font-weight: 500 800;
  font-stretch: 75% 100%;
  font-display: swap;
  src: url(fonts/bricolage-grotesque-latin-ext.woff2) format('woff2');
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
@font-face {
  font-family: 'Bricolage Grotesque';
  font-style: normal;
  font-weight: 500 800;
  font-stretch: 75% 100%;
  font-display: swap;
  src: url(fonts/bricolage-grotesque-latin.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
/* Kâğıt (açık) ve karatahta (koyu) temaları */
:root{--paper:#F5F6F8;--sheet:#FFFFFF;--ink:#14213D;--mute:#59637A;--rule:#D5DBE6;--grid:#E7EBF2;--blue:#2142C8;--on-blue:#FFFFFF;--red:#C81E36;--hl:#FFE45C;--green:#17794B;--field:#FFFFFF;--display:'Bricolage Grotesque','Atkinson Hyperlegible Next',system-ui,sans-serif;--body:'Atkinson Hyperlegible Next',system-ui,-apple-system,'Segoe UI',sans-serif}
[data-theme=dark]{--paper:#16211D;--sheet:#1D2B26;--ink:#ECEEE4;--mute:#A5B2AA;--rule:#35473F;--grid:#1B2823;--blue:#9DBBFF;--on-blue:#0F1A16;--red:#FF9188;--hl:#F5D84B;--green:#7BD7A4;--field:#16211D}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:400 1rem/1.55 var(--body);color:var(--ink);background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
h1,h2,h3{font-family:var(--display);font-stretch:85%;margin:0;line-height:1.1;letter-spacing:-.01em}
h1{font-size:clamp(2rem,7vw,3rem);font-weight:750}
h2{font-size:1.2rem;font-weight:650}
h3{font-size:1.08rem;font-weight:650;font-stretch:90%}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
input,select,textarea{font:inherit;width:100%;padding:9px 10px;border:1.5px solid var(--rule);border-radius:6px;background:var(--field);color:inherit}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline-offset:0;border-color:var(--blue)}
textarea{min-height:76px;resize:vertical}
input[type=checkbox]{width:20px;height:20px;padding:0;accent-color:var(--blue);flex:none}
svg.ic{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* düzen */
.pub .sbar,.pub .sbtn{display:none!important}
.pub #app{display:block}
#app{display:block}
#col{min-width:0}
.mast{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--rule)}
.brand{font:700 1.15rem/1 var(--display);font-stretch:80%}
.sbar{display:none;flex:1;position:relative}
.sbar .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--mute)}
.sbar input{padding-left:36px}
body.sopen .sbar{display:block}
body.sopen .brand{display:none}
main{max-width:880px;padding:20px 16px 110px}
.vh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:6px 0 16px}
.tools{display:flex;gap:8px;flex-wrap:wrap}

/* gezinme: mobilde alt çubuk, geniş ekranda sol ray */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sheet);border-top:1px solid var(--rule);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
#nav .nv{display:flex;gap:2px}
.nvb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex:1;min-height:52px;padding:4px 2px;border-radius:6px;font-size:.74rem;font-weight:600;color:var(--mute)}
.nvb svg{width:22px;height:22px}
.nvb.on{background:var(--hl);color:#14213D}
#nav .sec,#nav .nvtools,#nav .brand-d{display:none}
#more{position:fixed;left:8px;right:8px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:25;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:6px;display:grid}
#more .nvb{flex-direction:row;justify-content:flex-start;gap:12px;font-size:1rem;min-height:46px;padding:8px 12px}
@media(min-width:900px){
  #app{display:grid;grid-template-columns:232px minmax(0,1fr)}
  #nav{position:sticky;top:0;height:100vh;border-top:0;border-right:1px solid var(--rule);padding:22px 12px;display:flex;flex-direction:column}
  #nav .brand-d{display:block;font:750 1.6rem/1 var(--display);font-stretch:78%;padding:0 10px 22px}
  #nav .nv{flex-direction:column;gap:2px}
  #nav .nvb{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:.97rem;min-height:42px;padding:6px 10px}
  #nav .nvb svg{width:20px;height:20px}
  #nav .sec{display:flex}
  #nav .morebtn{display:none}
  #nav .nvtools{display:flex;flex-direction:column;margin-top:auto;border-top:1px solid var(--rule);padding-top:10px}
  #more{display:none!important}
  .mast .brand{display:none}
  .sbar{display:block;max-width:420px}
  .mast .sbtn{display:none}
  main{padding:26px 32px 60px}
  .mast{padding:12px 32px}
}

/* yüzeyler: küçük köşe, gölge yok */
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:16px;margin-bottom:16px}
.sheet>h2{margin-bottom:10px}
.sheet.hl{border-left:5px solid var(--hl)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 14px;border:1.5px solid var(--ink);border-radius:6px;background:var(--sheet);font-weight:700;font-size:.95rem}
.btn:hover{background:var(--hl);color:#14213D;border-color:var(--ink)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.pri:hover{filter:brightness(1.1);background:var(--blue);color:var(--on-blue)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.danger:hover{background:var(--red);color:var(--sheet);border-color:var(--red)}
.btn.sm{min-height:34px;padding:0 10px;font-size:.86rem}
.ibtn{width:38px;height:38px;display:inline-grid;place-items:center;border-radius:6px;color:var(--mute)}
.ibtn:hover{background:var(--hl);color:#14213D}
.ibtn.danger:hover{background:var(--red);color:var(--sheet)}
.hint{color:var(--mute);font-size:.85rem}
.meta{color:var(--mute);font-size:.88rem;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.meta .ic{width:1em;height:1em;vertical-align:-.15em;margin-right:4px}
.late{color:var(--red);font-weight:700}
.tag{font-size:.78rem;font-weight:600;border:1px solid var(--rule);border-radius:3px;padding:0 6px;color:var(--mute);white-space:nowrap}
.empty{text-align:center;padding:28px 12px;display:grid;gap:12px;justify-items:center;color:var(--mute)}
.row2{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--rule)}
.row2:first-of-type{border-top:0}
.row2.go{cursor:pointer}
.row2.go:hover{background:var(--grid)}
.grid2{display:grid;gap:0 16px}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr;align-items:start}}

/* bugün */
.hero{margin:6px 0 20px}
.hero .hd{color:var(--mute);font-weight:600;margin-bottom:4px}
.hero .hs{margin-top:10px;font-size:1.05rem;max-width:52ch}
mark{background:var(--hl);color:#14213D;padding:0 4px;border-radius:2px}

/* optik form: A-E baloncukları durumları gösterir */
.qn{font:700 .95rem var(--display);color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
.orow{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--rule)}
.orow:first-of-type{border-top:0}
.ot{font-size:.95rem;line-height:1.25;overflow-wrap:anywhere}
.otc{display:grid;gap:5px;min-width:0}
.otc .pct{font-family:var(--display);font-weight:700;font-size:.85rem;color:var(--mute);min-width:40px;text-align:right}
.obs{display:flex;gap:3px}
.bub{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink);display:inline-grid;place-items:center;font-size:.72rem;font-weight:700;color:var(--mute);background:transparent;padding:0;flex:none}
button.bub:hover{background:var(--hl);color:#14213D}
.bub.sel,button.bub.sel:hover{background:var(--ink);color:var(--sheet)}
.bub.big{width:38px;height:38px;font-size:.82rem}
@media(prefers-reduced-motion:no-preference){.bub.pop{animation:pop .3s ease-out}}
@keyframes pop{0%{transform:scale(.55)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
.legend{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 14px;margin-top:14px;padding-top:12px;border-top:1px solid var(--rule);font-size:.88rem}
@media(min-width:620px){.legend{grid-template-columns:repeat(3,1fr)}}
.legend div{display:flex;align-items:center;gap:8px}
.legend .bub{width:22px;height:22px;font-size:.62rem}
.legend b{margin-left:auto;font-family:var(--display);font-variant-numeric:tabular-nums}

@media(max-width:400px){.sheet{padding:14px 12px}.orow{gap:6px;grid-template-columns:20px minmax(0,1fr) auto}.bub{width:28px;height:28px}.legend .bub{width:22px;height:22px}.obs{gap:2px}}
/* cetvel: ilerleme */
.ruler{--v:0%;display:block;width:100%;height:30px;margin:0;padding:0;border:0;border-radius:0;-webkit-appearance:none;appearance:none;
  background:
   linear-gradient(var(--ink),var(--ink)) right top/1px 12px no-repeat,
   repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 10%) left top/100% 12px no-repeat,
   repeating-linear-gradient(90deg,var(--mute) 0 1px,transparent 1px 5%) left top/100% 7px no-repeat,
   linear-gradient(90deg,var(--blue) var(--v),var(--rule) var(--v)) left bottom/100% 10px no-repeat}
div.ruler{height:22px}
.ruler::-webkit-slider-runnable-track{height:30px;background:transparent}
.ruler::-moz-range-track{height:30px;background:transparent}
.ruler::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:30px;background:var(--hl);border:2px solid var(--ink);border-radius:2px;cursor:grab}
.ruler::-moz-range-thumb{width:10px;height:26px;background:var(--hl);border:2px solid var(--ink);border-radius:2px;cursor:grab}
.ruler:disabled{opacity:.7}
.ruler:disabled::-webkit-slider-thumb{visibility:hidden}
.ruler:disabled::-moz-range-thumb{visibility:hidden}
.rrow{display:flex;align-items:center;gap:12px;margin:12px 0 4px}
.rrow b{font:700 1.05rem var(--display);min-width:46px;text-align:right;font-variant-numeric:tabular-nums}
.sum{font:750 clamp(1.4rem,5vw,1.9rem)/1.15 var(--display);font-stretch:85%;margin-bottom:6px}

/* söz kartı */
.pc{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;margin-bottom:12px}
.pc.overdue{border-left:4px solid var(--red)}
.pc .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pc .top h3{padding-top:6px}
.pc .acts{display:flex;flex:none}
.stl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0 2px}
.stl .obs{gap:4px}
.stn{font:650 .95rem var(--display);font-stretch:90%}
.gh{display:flex;align-items:baseline;gap:8px;margin:24px 0 10px}
.gh span{font:700 .9rem var(--display);color:var(--mute)}
details{border-top:1px dashed var(--rule);margin-top:10px;padding-top:4px}
summary{cursor:pointer;font-weight:700;font-size:.92rem;color:var(--mute);padding:8px 0;list-style:none;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::before{content:"";border:5px solid transparent;border-left:7px solid currentColor;border-right:0;transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}
.note{font-size:.92rem;padding:5px 0;display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
.note time{color:var(--mute);font-size:.8rem;display:block}
.add{display:flex;gap:8px;margin-top:8px}
.add input,.add select{flex:1;min-width:0}
.ai{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;margin:4px 0;font-weight:400;cursor:pointer}
.ai input{margin-top:2px}
.ai.done span{text-decoration:line-through;color:var(--mute)}
.filters{display:flex;gap:8px;margin-bottom:6px}
.filters select{flex:1}

/* kayıtlar: toplantı ve karar */
.rec{display:grid;grid-template-columns:62px minmax(0,1fr);gap:14px}
.dblock{text-align:center;border-right:1px solid var(--rule);padding-right:12px;font-family:var(--display);line-height:1}
.dblock b{display:block;font-size:2.2rem;font-weight:750;font-stretch:85%}
.dblock span{display:block;font-size:.8rem;color:var(--mute);margin-top:5px;font-weight:600}
.rec .bd{display:grid;gap:8px;min-width:0}
.rec h3{font-size:.95rem;color:var(--mute);font-weight:700;margin-top:4px}
.rec .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.rec .ra{display:flex;gap:6px;justify-content:flex-end}

/* takvim */
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--rule);border-left:1px solid var(--rule);background:var(--sheet)}
.cal .h{padding:6px 0;text-align:center;font-size:.8rem;color:var(--mute);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);font-weight:700}
.day{min-height:60px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:4px 5px;text-align:left;font-weight:700;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.day.out{color:var(--mute);opacity:.55}
.day.today{background:var(--hl);color:#14213D}
.day.sel{outline:2.5px solid var(--ink);outline-offset:-2.5px}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dot{width:8px;height:8px;display:inline-block;vertical-align:middle;margin-right:6px}
.dots .dot{margin:0}
.dot.ev{background:var(--blue);border-radius:50%}
.dot.mt{border:2px solid var(--green);border-radius:50%}
.dot.pt{background:var(--red);transform:rotate(45deg);width:7px;height:7px}
.legend2{display:flex;gap:16px;font-size:.82rem;color:var(--mute);margin:10px 0 16px;flex-wrap:wrap}
.calnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.calnav strong{font:700 1.2rem var(--display);font-stretch:85%;text-transform:capitalize}

/* fikirler */
.idea{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px}
.vote{display:flex;flex-direction:column;align-items:center;gap:0}
.vote b{font:750 1.2rem var(--display);font-variant-numeric:tabular-nums}
.vote .ibtn{width:36px;height:30px}

/* formlar */
dialog{border:0;border-radius:8px;padding:20px;width:min(560px,94vw);max-height:92vh;background:var(--sheet);color:var(--ink);border:1px solid var(--rule)}
dialog::backdrop{background:rgba(10,16,30,.55)}
dialog h2{margin-bottom:6px;font-size:1.5rem}
@media(max-width:600px){dialog{margin:auto 0 0;width:100%;max-width:none;border-radius:12px 12px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom))}}
label{display:block;font-weight:700;font-size:.9rem;margin:14px 0 5px}
label.chk{display:flex;gap:10px;align-items:center;font-weight:400;font-size:1rem}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.arow{display:grid;gap:6px;border:1px solid var(--rule);border-radius:6px;padding:8px;margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:10px 16px;border-radius:6px;display:none;z-index:50;max-width:90vw;font-weight:600}
#toast.err{background:var(--red);color:#fff}
.pubnote{border:1.5px dashed var(--ink);border-radius:6px;padding:12px 14px;margin-bottom:18px;font-size:.92rem;display:grid;gap:10px;justify-items:start}
#printSheet{display:none}
@media print{
  body>*:not(#printSheet){display:none!important}
  body{background:#fff}
  #printSheet{display:block;font:14pt/1.5 Georgia,serif;color:#000;background:#fff}
  #printSheet h1{text-align:center;font:700 24pt Georgia,serif;margin:0 0 4pt}
  #printSheet .sub{text-align:center;margin-bottom:18pt}
  #printSheet ol{padding-left:22pt}
  #printSheet li{margin-bottom:10pt;break-inside:avoid}
  #printSheet li small{display:block;color:#444}
}
</style>
</head>
<body>
<div id="app">
  <nav id="nav" aria-label="Ana menü"></nav>
  <div id="col">
    <header class="mast">
      <span class="brand">Öğrenci Meclisi</span>
      <div class="sbar"></div>
      <button class="ibtn sbtn" data-a="searchtoggle" aria-label="Ara" title="Ara"></button>
    </header>
    <main id="main"></main>
  </div>
</div>
<div id="more" hidden></div>
<input type="file" id="file" accept="application/json,.json" hidden>
<div id="printSheet"></div>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script>
const KEY = 'meclis-takip-v1';
const EXPORT_KEY = 'meclis-last-export';
const THEME_KEY = 'meclis-theme';
const STATUSES = ['Planlanıyor', 'İdare onayı bekleniyor', 'Devam ediyor', 'Tamamlandı', 'Ertelendi'];
const LETTERS = 'ABCDE';
const EVENT_TYPES = ['Etkinlik', 'Toplantı', 'Turnuva', 'Gezi', 'Diğer'];
const IDEA_STATUSES = ['Yeni', 'İnceleniyor', 'Kabul edildi', 'Reddedildi', 'Söze dönüştü'];
const NAV = { today: ['Bugün', 'sun'], promises: ['Sözler', 'checks'], calendar: ['Takvim', 'cal'], meetings: ['Toplantılar', 'users'],
  decisions: ['Kararlar', 'doc'], ideas: ['Fikirler', 'bulb'], public: ['Öğrenci görünümü', 'eye'] };
const PRIMARY = ['today', 'promises', 'calendar', 'meetings'], SECOND = ['decisions', 'ideas', 'public'];
const STALE_DAYS = 14, BACKUP_DAYS = 7;

/* ---------- yardımcılar ---------- */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parse = s => new Date(s + 'T00:00');
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };

function blankPromise(o = {}) {
  return { id: uid(), title: '', description: '', status: STATUSES[0], progress: 0, needsApproval: false, owner: '', target: '',
    budget: 0, spent: 0, autoProgress: false, checklist: [], notes: [], upd: Date.now(), ...o };
}

let state = load();

function load() {
  const raw = localStorage.getItem(KEY);
  return raw ? normalize(JSON.parse(raw)) : seed();
}
// Eski sürüm verisini ve yüklenen yedekleri doğrular; eksik alanları varsayılanla doldurur.
function normalize(d) {
  if (!d || !Array.isArray(d.promises) || !Array.isArray(d.meetings) || !Array.isArray(d.decisions))
    throw new Error('Geçersiz veri biçimi: promises, meetings ve decisions dizileri gerekli.');
  d.events ??= []; d.ideas ??= [];
  d.promises.forEach(p => {
    p.owner ??= ''; p.target ??= ''; p.description ??= ''; p.notes ??= []; p.checklist ??= [];
    p.budget = +p.budget || 0; p.spent = +p.spent || 0; p.autoProgress = !!p.autoProgress; p.upd ??= Date.now();
  });
  d.meetings.forEach(m => { m.actions ??= []; m.actions.forEach(a => { a.id ??= uid(); }); });
  return d;
}
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
function commit() { save(); render(); }
const touch = p => { p.upd = Date.now(); };

function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block';
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', err ? 6000 : 2500);
}
window.addEventListener('error', e => toast('Hata: ' + e.message, true));
window.addEventListener('unhandledrejection', e => toast('Hata: ' + (e.reason?.message || e.reason), true));

const isDark = () => document.documentElement.dataset.theme === 'dark';
function applyTheme() {
  const t = localStorage.getItem(THEME_KEY) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name=theme-color]').content = t === 'dark' ? '#16211D' : '#F5F6F8';
}

/* ---------- ortak parçalar ---------- */
const isOpen = p => p.status !== 'Tamamlandı' && p.status !== 'Ertelendi';
const isLate = p => isOpen(p) && p.target && p.target < today();
const lastTouch = p => Math.max(p.upd || 0, ...p.notes.map(n => n.t));
const pTitle = id => state.promises.find(p => p.id === id)?.title;
const find = (arr, id) => arr.find(x => x.id === id);
const byDate = (a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || ''));
const stIdx = p => Math.max(0, STATUSES.indexOf(p.status));

function recalc(p) {
  if (p.autoProgress && p.checklist.length && p.status !== 'Tamamlandı') p.progress = Math.round(p.checklist.filter(c => c.done).length / p.checklist.length * 100);
}
// Durumu değiştirir, günlüğe not düşer; tamamlanan söz %100 olur.
function setStatus(p, idx) {
  const old = p.status, s = STATUSES[idx];
  if (old === s) return;
  p.status = s;
  p.notes.push({ t: Date.now(), text: `Durum değişti: ${old} → ${s}` });
  if (s === 'Tamamlandı') p.progress = 100; else recalc(p);
  touch(p);
}

// Optik form baloncukları: A-E = beş durum
function bubbles(p, interactive, big) {
  const cur = stIdx(p);
  return `<span class="obs" role="group" aria-label="Durum">${STATUSES.map((s, k) => interactive
    ? `<button class="bub${big ? ' big' : ''}${k === cur ? ' sel' : ''}" data-a="setstatus" data-s="${k}" aria-label="${s}" aria-pressed="${k === cur}" title="${s}">${LETTERS[k]}</button>`
    : `<span class="bub${k === cur ? ' sel' : ''}" aria-label="${k === cur ? 'Durum: ' + s : s}" title="${s}">${LETTERS[k]}</span>`).join('')}</span>`;
}
function optikSheet(list, interactive, withProgress) {
  return list.map(p => `<div class="orow" data-id="${p.id}"><span class="qn">${state.promises.indexOf(p) + 1}</span>
    <div class="otc"><span class="ot">${esc(p.title)}</span>${withProgress ? `<div class="rrow" style="margin:0;gap:8px"><div class="ruler" style="--v:${p.progress}%"></div><span class="pct">%${p.progress}</span></div>` : ''}</div>
    ${bubbles(p, interactive)}</div>`).join('');
}
function legend() {
  return `<div class="legend">${STATUSES.map((s, k) => `<div><span class="bub">${LETTERS[k]}</span><span>${esc(s)}</span><b>${state.promises.filter(p => p.status === s).length}</b></div>`).join('')}</div>`;
}
function summary() {
  const ps = state.promises, n = ps.length, done = ps.filter(p => p.status === 'Tamamlandı').length;
  const avg = n ? Math.round(ps.reduce((a, p) => a + p.progress, 0) / n) : 0;
  const budget = ps.reduce((a, p) => a + p.budget, 0), spent = ps.reduce((a, p) => a + p.spent, 0);
  return `<p class="sum">${n} sözden ${done} tanesi tamamlandı</p>
    <div class="rrow" style="margin-top:8px"><div class="ruler" style="--v:${avg}%" role="img" aria-label="Genel ilerleme yüzde ${avg}"></div><b>%${avg}</b></div>
    ${budget || spent ? `<p class="meta" style="margin-top:8px">${ic('coin')}Bütçe ${money(budget)}, harcanan ${money(spent)}</p>` : ''}`;
}
function grouped(list, renderOne) {
  const out = STATUSES.map(s => {
    const l = list.filter(p => p.status === s);
    return l.length ? `<h2 class="gh">${esc(s)} <span>${l.length}</span></h2>${l.map(renderOne).join('')}` : '';
  }).join('');
  return out || `<div class="empty"><p>Bu filtreye uyan söz yok.</p></div>`;
}

  </article>`;
}
function viewPromises() {
  let list = state.promises.filter(p => ui.pf === 'all' ? true : ui.pf === 'geciken' ? isLate(p) : ui.pf === 'onay' ? p.needsApproval && p.status !== 'Tamamlandı' : p.status === ui.pf);

  if (ui.psort === 'hedef') list.sort((a, b) => (a.target || '9999').localeCompare(b.target || '9999'));

    pt: state.promises.filter(p => p.target === d && p.status !== 'Tamamlandı')

}
function viewCalendar() {
  const { y, m } = ui.cal, first = new Date(y, m, 1), start = addDays(first, -((first.getDay() + 6) % 7));
  const t = today();
  const cells = Array.from({ length: 42 }, (_, i) => {
    const d = addDays(start, i), s = ymd(d), it = dayItems(s);

  return `<div class="vh"><h1>Takvim</h1>${B('newev', ic('plus') + 'Yeni etkinlik', 'pri', `data-d="${sel}"`)}</div>

/* ---------- Arama ---------- */
function viewSearch() {
  const q = ui.q.trim().toLocaleLowerCase('tr'), has = (...s) => s.some(v => String(v ?? '').toLocaleLowerCase('tr').includes(q));
  const groups = [
    ['Sözler', 'promises', state.promises.filter(p => has(p.title, p.description, p.owner, ...p.notes.map(n => n.text), ...p.checklist.map(c => c.text))).map(p => [p.title, p.status])],
    ['Toplantılar', 'meetings', state.meetings.filter(m => has(m.attendees, m.topics, m.decisions, ...m.actions.map(a => a.text))).map(m => [fmtDate(m.date), (m.topics || '').slice(0, 80)])],
    ['Kararlar', 'decisions', state.decisions.filter(d => has(d.text)).map(d => [d.text.slice(0, 100), fmtDate(d.date)])],
    ['Etkinlikler', 'calendar', state.events.filter(e => has(e.title, e.note)).map(e => [e.title, fmtDate(e.date)])],
    ['Fikirler', 'ideas', state.ideas.filter(i => has(i.text, i.source)).map(i => [i.text.slice(0, 100), i.status])]
  ].filter(g => g[2].length);
  return `<div class="vh"><h1>Arama</h1></div><p class="hint" style="margin:-6px 0 14px">"${esc(ui.q.trim())}" için sonuçlar</p>` +
    (groups.map(([t, go, rows]) => `<section class="sheet"><h2>${t} (${rows.length})</h2>
    ${rows.map(r => `<div class="row2 go" data-go="${go}"><div>${esc(r[0])}</div><div class="meta">${esc(r[1])}</div></div>`).join('')}</section>`).join('') || '<div class="empty"><p>Sonuç bulunamadı. Başka bir sözcük dene.</p></div>');
}

/* ---------- Öğrenci görünümü (salt okunur; not, sorumlu, bütçe, toplantı yok) ---------- */
function publicBody() {
  const ps = state.promises, n = ps.length, done = ps.filter(p => p.status === 'Tamamlandı').length;
  const avg = n ? Math.round(ps.reduce((a, p) => a + p.progress, 0) / n) : 0;
  return `<section class="sheet"><p class="sum">${n} sözden ${done} tanesi tamamlandı</p>
    <div class="rrow" style="margin-top:8px"><div class="ruler" style="--v:${avg}%" role="img" aria-label="Genel ilerleme yüzde ${avg}"></div><b>%${avg}</b></div></section>
    <section class="sheet">${optikSheet(ps, false, true)}${legend()}</section>`;
}
function viewPublic() {
  return `<div class="vh"><h1>Seçim sözlerimiz</h1></div>
    <div class="pubnote"><span>Öğrencilerin göreceği salt okunur görünüm bu. Notlar, sorumlular, bütçe ve toplantılar gösterilmez.</span>
      ${B('snapshot', ic('down') + 'Paylaşmak için indir', 'pri sm')}</div>${publicBody()}`;
}
function downloadSnapshot() {
  let css = $('#css').textContent;
  if (location.protocol.startsWith('http')) css = css.replaceAll('url(fonts/', 'url(' + new URL('fonts/', location.href).href);
  const html = `<!DOCTYPE html><html lang="tr" data-theme="${document.documentElement.dataset.theme}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seçim Sözlerimiz</title><style>${css}</style></head><body>
<header class="mast"><span class="brand">Öğrenci Meclisi</span></header>
<main style="margin:0 auto"><div class="vh"><h1>Seçim sözlerimiz</h1></div><p class="hint" style="margin:-6px 0 14px">Son güncelleme: ${fmtDate(today())}</p>${publicBody()}</main></body></html>`;
  download('ogrenci-gorunumu.html', html, 'text/html');
}

/* ---------- Yedek ---------- */
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: type + ';charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- Gezinme ve render ---------- */
const navBtn = (k, cls = '') => `<button class="nvb ${cls}${tab === k ? ' on' : ''}" data-tab="${k}"${tab === k ? ' aria-current="page"' : ''}>${ic(NAV[k][1])}<span>${NAV[k][0]}</span></button>`;
const toolBtns = () => `<button class="nvb" data-a="theme">${ic(isDark() ? 'sun' : 'moon')}<span>${isDark() ? 'Açık tema' : 'Koyu tema'}</span></button>
  <button class="nvb" data-a="export">${ic('down')}<span>Yedekle</span></button><button class="nvb" data-a="import">${ic('up')}<span>Yedek yükle</span></button>`;
function renderNav() {
  const moreOn = SECOND.includes(tab);
  $('#nav').innerHTML = `<div class="brand-d">Öğrenci<br>Meclisi</div><div class="nv">${PRIMARY.map(k => navBtn(k)).join('')}${SECOND.map(k => navBtn(k, 'sec')).join('')}
    <button class="nvb morebtn${moreOn ? ' on' : ''}" data-a="more" aria-expanded="${ui.more}">${ic('more')}<span>Daha</span></button></div><div class="nvtools">${toolBtns()}</div>`;
  $('#more').innerHTML = SECOND.map(k => navBtn(k)).join('') + toolBtns();
  $('#more').hidden = !ui.more;
}
const VIEWS = { today: viewToday, promises: viewPromises, calendar: viewCalendar, meetings: viewMeetings, decisions: viewDecisions, ideas: viewIdeas, public: viewPublic, search: viewSearch };
function render() {
  const pub = tab === 'public' && location.hash === '#ogrenci';
  document.body.classList.toggle('pub', pub);
  $('#nav').hidden = pub; $('.sbtn').hidden = pub;
  if (pub) $('#more').hidden = true; else renderNav();
  $('#main').innerHTML = VIEWS[tab]() + (pub ? `<p>${B('admin', 'Yönetici görünümüne dön', 'sm')}</p>` : '');
}
function go(t) {
  tab = t; ui.q = ''; ui.more = false;
  const q = $('#q'); if (q) q.value = '';
  document.body.classList.remove('sopen');
  render(); window.scrollTo(0, 0);
}

/* ---------- Olaylar ---------- */
const dlg = $('#dlg');
function openDlg(html) { dlg.innerHTML = html; dlg.showModal(); }

document.addEventListener('click', e => {
  if (ui.more && !e.target.closest('[data-a=more]') && (!e.target.closest('#more') || e.target.closest('button'))) { ui.more = false; $('#more').hidden = true; }
  const tb = e.target.closest('[data-tab]');
  if (tb) { go(tb.dataset.tab); return; }
  const gt = e.target.closest('[data-go]');
  if (gt && !e.target.closest('[data-a]')) { go(gt.dataset.go); return; }
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const a = el.dataset.a, card = el.closest('[data-id]'), id = card?.dataset.id;
  const p = find(state.promises, id), m = find(state.meetings, id), d = find(state.decisions, id), ev = find(state.events, id), idea = find(state.ideas, id);
  switch (a) {
    case 'close': dlg.close(); break;
    case 'more': ui.more = !ui.more; $('#more').hidden = !ui.more; el.setAttribute('aria-expanded', ui.more); break;
    case 'searchtoggle': {
      const open = document.body.classList.toggle('sopen');
      if (open) $('#q').focus(); else { $('#q').value = ''; $('#q').dispatchEvent(new Event('input', { bubbles: true })); }
    } break;
    case 'theme': localStorage.setItem(THEME_KEY, isDark() ? 'light' : 'dark'); applyTheme(); renderNav(); break;
    case 'export': download(`meclis-yedek-${today()}.json`, JSON.stringify(state, null, 2), 'application/json');
      localStorage.setItem(EXPORT_KEY, Date.now()); render(); break;
    case 'import': $('#file').click(); break;
    case 'print': printDecisions(); break;
    case 'snapshot': downloadSnapshot(); break;
    case 'admin': history.replaceState(null, '', location.pathname); go('today'); break;
    /* sözler */
    case 'setstatus':
      setStatus(p, +el.dataset.s); commit();
      document.querySelectorAll(`[data-id="${id}"] .bub.sel`).forEach(b => b.classList.add('pop'));
      document.querySelector(`[data-id="${id}"] .bub.sel`)?.focus();
      break;
    case 'newp': openDlg(promiseForm()); break;
    case 'editp': openDlg(promiseForm(p)); break;
    case 'delp':
      if (confirm(`"${p.title}" sözünü silmek istediğine emin misin?`)) {
        state.meetings.forEach(mm => mm.actions.forEach(x => { if (x.promiseId === p.id) x.promiseId = ''; }));
        state.events.forEach(x => { if (x.promiseId === p.id) x.promiseId = ''; });
        state.promises = state.promises.filter(x => x !== p); commit();
      } break;
    case 'addnote': {
      const text = card.querySelector('[data-note]').value.trim();
      if (!text) return;
      p.notes.push({ t: Date.now(), text }); touch(p); ui.open.add(p.id + ':nt'); commit();
    } break;
    case 'delnote': p.notes = p.notes.filter(n => String(n.t) !== el.dataset.t); touch(p); commit(); break;
    case 'addcl': {
      const text = card.querySelector('[data-cl]').value.trim();
      if (!text) return;
      p.checklist.push({ id: uid(), text, done: false }); recalc(p); touch(p); ui.open.add(p.id + ':cl'); commit();
    } break;
    case 'togglecl': find(p.checklist, el.dataset.cid).done = el.checked; recalc(p); touch(p); commit(); break;
    case 'delcl': p.checklist = p.checklist.filter(c => c.id !== el.dataset.cid); recalc(p); touch(p); commit(); break;
    case 'quicknote': {
      const target = find(state.promises, $('#qnp').value), text = $('#qnt').value.trim();
      if (!target) throw new Error('Önce bir söz ekle.');
      if (!text) return;
      target.notes.push({ t: Date.now(), text }); touch(target); commit(); toast('Not eklendi.');
    } break;
    /* takvim */
    case 'calprev': ui.cal.m--; if (ui.cal.m < 0) { ui.cal.m = 11; ui.cal.y--; } render(); break;
    case 'calnext': ui.cal.m++; if (ui.cal.m > 11) { ui.cal.m = 0; ui.cal.y++; } render(); break;
    case 'caltoday': ui.cal = { y: new Date().getFullYear(), m: new Date().getMonth() }; ui.calSel = today(); render(); break;
    case 'day': ui.calSel = el.dataset.d; render(); break;
    case 'newev': openDlg(eventForm(null, el.dataset.d)); break;
    case 'editev': openDlg(eventForm(ev)); break;
    case 'delev': if (confirm('Bu etkinlik silinsin mi?')) { state.events = state.events.filter(x => x !== ev); commit(); } break;
    /* toplantılar */
    case 'newm': openDlg(meetingForm()); break;
    case 'editm': openDlg(meetingForm(m)); break;
    case 'delm': if (confirm('Bu toplantı kaydı silinsin mi?')) { state.meetings = state.meetings.filter(x => x !== m); commit(); } break;
    case 'toggleact': {
      const act = state.meetings.flatMap(mm => mm.actions).find(x => x.id === el.dataset.aid);
      act.done = el.checked; commit();
    } break;
    case 'addrow': $('#rows').insertAdjacentHTML('beforeend', actionRow()); break;
    case 'rmrow': el.closest('.arow').remove(); break;
    /* kararlar */
    case 'newd': openDlg(decisionForm()); break;
    case 'editd': openDlg(decisionForm(d)); break;
    case 'deld': if (confirm('Bu karar silinsin mi?')) { state.decisions = state.decisions.filter(x => x !== d); commit(); } break;
    /* fikirler */
    case 'newi': openDlg(ideaForm()); break;
    case 'editi': openDlg(ideaForm(idea)); break;
    case 'deli': if (confirm('Bu fikir silinsin mi?')) { state.ideas = state.ideas.filter(x => x !== idea); commit(); } break;
    case 'vote': idea.votes = Math.max(0, idea.votes + +el.dataset.v); commit(); break;
    case 'toprom': {
      const np = blankPromise({ title: idea.text.slice(0, 80), description: idea.text.length > 80 ? idea.text : '' });
      np.notes.push({ t: Date.now(), text: 'Fikir kutusundan söze dönüştürüldü.' });
      state.promises.push(np); idea.status = 'Söze dönüştü'; commit(); toast('Söz olarak eklendi. Sözler sekmesinden düzenleyebilirsin.');
    } break;
  }
});

// Kaydırıcıyı bırakınca kaydet; sürüklerken yalnızca etiketi ve cetvel dolgusunu güncelle
document.addEventListener('input', e => {
  if (e.target.matches('[data-a=progress]')) {
    e.target.style.setProperty('--v', e.target.value + '%');
    e.target.nextElementSibling.textContent = '%' + e.target.value;
  }
  if (e.target.id === 'q') {
    const v = e.target.value;
    if (v.trim()) { if (tab !== 'search') ui.prev = tab; tab = 'search'; ui.q = v; }
    else if (tab === 'search') { tab = ui.prev; ui.q = ''; }
    render();
  }
});
document.addEventListener('change', e => {
  if (e.target.matches('[data-a=progress]')) {
    const p = find(state.promises, e.target.closest('[data-id]').dataset.id);
    p.progress = +e.target.value; touch(p); commit();
  }
  if (e.target.matches('[data-f]')) { ui[e.target.dataset.f] = e.target.value; render(); }
});
document.addEventListener('toggle', e => {
  const k = e.target.dataset?.k;
  if (k) e.target.open ? ui.open.add(k) : ui.open.delete(k);
}, true);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ui.more) { ui.more = false; $('#more').hidden = true; }
  if (e.key !== 'Enter') return;
  if (e.target.matches('[data-note],[data-cl],#qnt')) { e.preventDefault(); e.target.nextElementSibling.click(); }
});

dlg.addEventListener('submit', e => {
  if (e.submitter?.value !== 'ok') return;
  const f = e.target, kind = f.dataset.form, id = f.dataset.id, fd = new FormData(f);
  if (kind === 'promise') {
    const status = fd.get('status');
    const data = { title: fd.get('title').trim(), description: fd.get('description').trim(), progress: +fd.get('progress'),
      autoProgress: fd.has('autoProgress'), needsApproval: fd.has('needsApproval'), owner: fd.get('owner').trim(), target: fd.get('target'),
      budget: +fd.get('budget') || 0, spent: +fd.get('spent') || 0 };
    let p = id && find(state.promises, id);
    if (p) { Object.assign(p, data); setStatus(p, STATUSES.indexOf(status)); }
    else { p = blankPromise({ ...data, status }); if (status === 'Tamamlandı') p.progress = 100; state.promises.push(p); }
    recalc(p); touch(p);
  } else if (kind === 'meeting') {
    const actions = [...f.querySelectorAll('.arow')].map(r => ({ id: uid(), text: r.querySelector('[data-at]').value.trim(),
      promiseId: r.querySelector('[data-ap]').value, done: r.querySelector('[data-ad]').value === '1' })).filter(a => a.text);
    const data = { date: fd.get('date'), attendees: fd.get('attendees').trim(), topics: fd.get('topics').trim(), decisions: fd.get('decisions').trim(), actions };
    const m = id && find(state.meetings, id);
    if (m) Object.assign(m, data); else state.meetings.push({ id: uid(), ...data });
  } else if (kind === 'decision') {
    const data = { date: fd.get('date'), text: fd.get('text').trim() };
    const d = id && find(state.decisions, id);
    if (d) Object.assign(d, data); else state.decisions.push({ id: uid(), ...data });
  } else if (kind === 'event') {
    const data = { title: fd.get('title').trim(), date: fd.get('date'), time: fd.get('time'), type: fd.get('type'), promiseId: fd.get('promiseId'), note: fd.get('note').trim() };
    const ev = id && find(state.events, id);
    if (ev) Object.assign(ev, data); else state.events.push({ id: uid(), ...data });
    ui.calSel = data.date; const dt = parse(data.date); ui.cal = { y: dt.getFullYear(), m: dt.getMonth() };
  } else if (kind === 'idea') {
    const data = { text: fd.get('text').trim(), source: fd.get('source').trim(), status: fd.get('status'), votes: Math.max(0, +fd.get('votes') || 0) };
    const i = id && find(state.ideas, id);
    if (i) Object.assign(i, data); else state.ideas.push({ id: uid(), date: today(), ...data });
  }
  commit();
});

$('#file').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  const data = normalize(JSON.parse(await file.text()));
  if (!confirm('Mevcut tüm veriler bu dosyadaki verilerle değiştirilecek. Devam edilsin mi?')) return;
  state = data; commit(); toast('Veriler yüklendi.');
});

window.addEventListener('hashchange', () => go(location.hash === '#ogrenci' ? 'public' : 'today'));
$('.sbar').innerHTML = `${ic('search')}<input id="q" type="search" placeholder="Söz, not, toplantı, karar ya da fikir ara" aria-label="Ara">`;
$('.sbtn').innerHTML = ic('search');
applyTheme();
render();
if (navigator.storage?.persist) navigator.storage.persist();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
</script>
